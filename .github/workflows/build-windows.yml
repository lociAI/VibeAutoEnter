name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows executable
        run: |
          dotnet publish VibeAutoEnter.Windows/VibeAutoEnter.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o release-windows

      - name: Upload VibeAutoEnter.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeAutoEnter-Windows-x64
          path: release-windows/VibeAutoEnter.exe

      - name: Publish GitHub Release with VibeAutoEnter.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: VibeAutoEnter v1.2.0 (Windows)
          files: release-windows/VibeAutoEnter.exe
